<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Explainer Chat Repo — Architecture &amp; Local Backend Probe</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 2rem auto; max-width: 52rem; padding: 0 1rem; line-height: 1.5; color: #111827; }
    code, pre { background: #f3f4f6; border-radius: 6px; padding: 0.15rem 0.35rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    pre { padding: 1rem; overflow-x: auto; }
    button { background: #111827; color: #ffffff; border: 0; border-radius: 6px; padding: 0.5rem 0.9rem; cursor: pointer; }
    button:hover { background: #374151; }
    .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>Explainer Chat Repo</h1>
  <p>Static GitHub Pages documentation paired with an optional loopback SQLite WAL + FTS5 backend (<code>127.0.0.1:8765</code>).</p>

  <div class="card">
    <h2>Local Backend Health Probe</h2>
    <p>Checks <code>http://127.0.0.1:8765/api/health</code> with an allowlisted <code>Origin</code>.</p>
    <button id="probe-btn" type="button">Probe Local Backend</button>
    <pre id="probe-out">Idle.</pre>
  </div>

  <script>
    const btn = document.getElementById("probe-btn");
    const out = document.getElementById("probe-out");
    btn.addEventListener("click", async () => {
      out.textContent = "Probing http://127.0.0.1:8765/api/health ...";
      try {
        const res = await fetch("http://127.0.0.1:8765/api/health", {
          headers: { "Origin": window.location.origin }
        });
        const data = await res.json();
        out.textContent = JSON.stringify({ status: res.status, data }, null, 2);
      } catch (err) {
        out.textContent = JSON.stringify({ error: String(err) }, null, 2);
      }
    });
  </script>
</body>
</html>
